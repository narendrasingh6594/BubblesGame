<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buy Mini Card</title>
<link rel="stylesheet" href="bycard.css">
</head>
<body>

<div class="buyOverlay" id="buyOverlay">
    <div class="buyCard">
        <button class="buyClose" id="buyClose">✕</button>
        <div class="buyIcon" id="buyIcon">⏰</div>
        <h3 class="buyName" id="buyName">Time Boost</h3>

        <div class="qtyStepper">
            <button class="qtyBtn" id="qtyMinus">−</button>
            <div class="qtyValue" id="qtyValue">1</div>
            <button class="qtyBtn" id="qtyPlus">+</button>
        </div> 
        <p class="qtyHint">1 baar mein 1 se 5 item hi khareed sakte ho</p>

        <div class="buyTotal">Total: <span id="buyTotal">150</span></div>

        <button class="btn-confirmBuy" id="confirmBuyBtn">Confirm Purchase</button>
    </div>
</div>

</body>
<script src="bycard.js"></script>
</html>
